<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ashen Voice Diagnostics</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#0b0908;color:#f5eee8}
body{margin:0;padding:18px}.wrap{max-width:760px;margin:auto}.card{border:1px solid #3a2d27;background:#15110f;border-radius:14px;padding:12px;margin:10px 0}
h1{font-size:1.25rem}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #2d241f;padding:8px 0}.row:last-child{border:0}
.ok{color:#94d19a}.bad{color:#f09a91}.wait{color:#e6c786}.muted{color:#ae9e92;font-size:.8rem}button{border:1px solid #5a463b;background:#211711;color:#fff;border-radius:9px;padding:9px 11px;font:inherit}.log{white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;max-height:280px;overflow:auto}
</style></head>
<body><div class="wrap">
<h1>Ashen Voice Studio v0.7.0 Diagnostics</h1>
<div class="muted">This page tests the repo wiring without loading the full Kokoro model.</div>
<div class="card" id="checks"></div>
<div class="card"><button id="run">Run Checks</button> <button id="beep">Test iPhone Audio</button> <button id="home">Open Studio</button></div>
<div class="card"><b>Log</b><div id="log" class="log"></div></div>
</div>
<script>
const $=id=>document.getElementById(id),log=s=>{$('log').textContent+=s+'\n'},row=(name,val,cls='wait')=>`<div class="row"><span>${name}</span><b class="${cls}">${val}</b></div>`;
async function fetchOk(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${url}: HTTP ${r.status}`);return r}
async function run(){
  $('log').textContent=''; let html='';
  const basic=[['Worker',!!window.Worker],['IndexedDB',!!window.indexedDB],['AudioContext',!!(window.AudioContext||window.webkitAudioContext)],['WebGPU',!!navigator.gpu],['ReadableStream',!!window.ReadableStream]];
  for(const [n,v] of basic)html+=row(n,v?'available':'missing',v?'ok':'bad');
  $('checks').innerHTML=html;
  try{
    const m=await (await fetchOk('/book-data/manifest.json')).json();log('Manifest OK: '+JSON.stringify(m,null,2));html+=row('Manifest','loaded','ok');
    const c=m.chapters[m.activeChapter],base='/book-data/';
    const targets=[['Characters',m.characters],['Global pronunciations',m.globalPronunciations],['Production',c.production],['Manuscript',c.manuscript],['Chapter pronunciations',c.pronunciations],['Production guide',c.guide],['SFX library',m.sfxLibrary]];
    for(const [name,path] of targets){try{await fetchOk(base+path);html+=row(name,'loaded','ok')}catch(e){html+=row(name,'failed','bad');log(e.message)}}
  }catch(e){html+=row('Manifest','failed','bad');log(e.stack||e)}
  try{
    await fetchOk('/kokoro-worker.js?v=070');html+=row('Worker file','served','ok');const w=new Worker('/kokoro-worker.js?v=070',{type:'module'}),id='diag-'+Date.now();
    const pong=await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('Worker ping timeout')),5000);w.onmessage=e=>{if(e.data?.id===id){clearTimeout(to);res(e.data)}};w.onerror=e=>{clearTimeout(to);rej(new Error(e.message||'worker error'))};w.postMessage({id,type:'ping'})});
    w.terminate();html+=row('Worker ping',pong.version||'OK','ok');log('Worker ping OK');
  }catch(e){html+=row('Worker ping','failed','bad');log(e.stack||e)}
  $('checks').innerHTML=html;
}
$('run').onclick=run;$('home').onclick=()=>location.href='/';
$('beep').onclick=async()=>{try{const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();if(ctx.state==='suspended')await ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=440;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.18);log('Audio test requested. You should hear a short tone.');setTimeout(()=>ctx.close(),500)}catch(e){log('Audio test failed: '+e.message)}};
run();
</script></body></html>
