<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ashen Reference Runtime v0.8.4 Test</title><style>body{font-family:system-ui;background:#0b0908;color:#eee;padding:18px;max-width:760px;margin:auto}button{font-size:18px;padding:14px 18px;border-radius:10px}pre{white-space:pre-wrap;background:#171311;padding:12px;border-radius:10px;min-height:180px}.ok{color:#8fe3a1}.bad{color:#ff9f98}</style></head><body><h1>Ashen Reference Runtime v0.8.4</h1><p>Direct iPhone Safari test. Chatterbox starts in one-thread CPU/WASM mode only. WebGPU and JSEP are never requested.</p><button id="go">Test Chatterbox Runtime</button><pre id="log">Ready.</pre><script type="module">const log=document.querySelector('#log');const btn=document.querySelector('#go');const out=(s,c='')=>{log.textContent+='\n'+s;if(c)log.className=c;};const TF='https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';const VOX='https://esm.sh/voxshot@0.3.0?external=@huggingface/transformers';const WASM='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.26.0-dev.20260416-b7804b056c/dist/ort-wasm-simd-threaded.wasm';window.addEventListener('error',e=>out('WINDOW ERROR: '+(e.error?.stack||e.message),'bad'));window.addEventListener('unhandledrejection',e=>out('REJECTION: '+(e.reason?.stack||e.reason),'bad'));btn.onclick=async()=>{btn.disabled=true;log.className='';log.textContent='Starting v0.8.4 plain-WASM test...';try{out('1. Fetching plain ONNX WASM binary');const r=await fetch(WASM,{cache:'no-store'});out('   HTTP '+r.status+' · '+(r.headers.get('content-type')||''));if(!r.ok)throw new Error('WASM HTTP '+r.status);const bytes=await r.arrayBuffer();out('   '+bytes.byteLength+' bytes');await WebAssembly.compile(bytes);out('   WebAssembly.compile OK','ok');out('2. Importing Transformers.js 4.2.0');const tf=await import(TF);out('   Transformers import OK','ok');const wasm=tf.env?.backends?.onnx?.wasm;if(!wasm)throw new Error('No tf.env.backends.onnx.wasm');wasm.numThreads=1;wasm.proxy=false;wasm.wasmPaths={wasm:WASM};try{wasm.simd=true}catch{};try{tf.env.useBrowserCache=true}catch{};try{tf.env.allowRemoteModels=true}catch{};out('   ONNX configured: CPU/WASM, threads=1, proxy=false, JSEP=false','ok');out('3. Importing VoxShot 0.3.0');const mod=await import(VOX);out('   VoxShot import OK','ok');if(!mod.ChatterboxEngine)throw new Error('No ChatterboxEngine export');out('4. Loading Chatterbox directly with engine.load("wasm"). First run may download about 1.5 GB.');const engine=new mod.ChatterboxEngine({requiresGpu:false,stallTimeoutMs:300000,loadModule:async()=>tf,onProgress:p=>{const st=p?.status||'';const plan=p?.plan||'';if(st==='progress_total'&&Number.isFinite(Number(p.progress))){const raw=Number(p.progress);const pct=Math.round(raw<=1?raw*100:raw);log.textContent='Loading Chatterbox... '+pct+'%\nPlan: '+plan;}else if(st.startsWith('load-')){log.textContent+='\n'+st+' '+plan+(p.reason?' · '+p.reason:'');}}});await engine.load('wasm');out('SUCCESS: Chatterbox loaded with '+JSON.stringify(engine.loadedPlan||{device:engine.loadedDevice||'wasm'}),'ok');}catch(e){out('FAILED: '+(e?.stack||e?.message||String(e)),'bad');}finally{btn.disabled=false;}};</script></body></html>
